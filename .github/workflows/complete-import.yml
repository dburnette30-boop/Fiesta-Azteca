          INLINE = json.loads('{"README-DAVE.txt": "FIESTA AZTECA OF SUNTREE \\u2014 REDESIGNED WEBSITE\\nPrepared October 26, 2026 for Sheri to hand off to Dave.\\n\\nThe website folder contains the complete static site. Open index.html for a local look, or serve that folder with any static web server. No build, dependencies, API keys, or accounts are needed.\\n\\nTO PUBLISH\\nUpload the contents of website/ to your hosting public directory, or replace the files in your existing Site source and publish through your normal workflow. Retain the folder structure. The original Site has not been changed.\\n\\nWHAT CHANGED\\nEntirely new homepage: full-bleed grilling-video hero, bold cream/yellow typography, dark cantina section, real restaurant food/drink/interior photographs, clearer navigation and visiting information. AI people backgrounds have been removed. The original restaurant pages and menu viewer remain available with a coordinated navigation header.\\n\\nVIDEO\\nassets/fajitas-grilling.mp4 is the supplied six-second video. It loops silently, plays inline, has a still-image poster and pause/play control, and respects reduced-motion preferences. The original is 640 x 360; a higher-resolution replacement would look sharper on large screens. Replace the file at the same path to upgrade it.\\n\\nEDITING\\nindex.html: new homepage and video hero.\\nhome.css: complete homepage design and responsive layouts.\\nhome.js: hero video controls and mobile navigation.\\nshared-header.css / navigation.js: coordinated navigation for other pages.\\nredesign.css: retained secondary-page overrides.\\nstyle.css / script.js: retained styling and interactions.\\nmenu-viewer.js: menu enlargement.\\nassets/: local images, menu pages, video, and poster.\\n\\nCONFIRM BEFORE LAUNCH\\nConfirm menu prices, restaurant details and any event-specific dates with the restaurant. Google Maps, Facebook, and optional Google Fonts need internet access.\\n\\nFESTIVE ACCENTS UPDATE\\nRed hand-drawn SVG arrow medallions, gold illustrated icon strip, and faded close-up mariachi guitar backgrounds. The supplied hero animation and real restaurant photos remain. fiesta-details.css contains these accents.\\n\\nDECORATIVE IMAGE\\nassets/mariachi-guitar-closeup.webp was created with the built-in image-generation tool as decoration; it is not a photo of the restaurant performers. Prompt: Atmospheric extreme close-up of two mariachi musicians playing acoustic guitars, wooden guitar bodies and strumming hands, black charro jackets with fine gold embroidery, red neckties, no faces, warm amber lighting and dark green/burgundy shadows, wide composition with shadow for text, no lettering or logos.\\n", ".openai/hosting.json": "{\\n  \\"project_id\\": \\"appgprj_6ae0c787345081918c83368a9421f271\\",\\n  \\"static\\": {\\n    \\"directory\\": \\"dist\\"\\n  }\\n}\\n", "dist/facebook-compact.css": "/* A compact Facebook section with larger regular text. */\\n.review-rest .social-band{padding:30px 6% 28px}\\n.review-rest .social-band>.eyebrow{display:block;margin-bottom:16px;font-size:13px}\\n.review-rest .social-band p{font-size:23px;line-height:1.5;margin:14px 0 18px}\\n.review-rest .facebook-corner-logo{top:22px;width:44px;height:44px}\\n@media(max-width:760px){.review-rest .social-band{padding:30px 6% 28px}.review-rest .social-band>.eyebrow{font-size:10px;letter-spacing:1.3px;margin-bottom:16px}.review-rest .facebook-corner-logo{top:20px;left:5%;width:30px;height:30px}.review-rest .social-band p{font-size:20px;line-height:1.5}}\\n", "dist/cantina-video.js": "(() => {\\n  const video = document.querySelector(\'.cantina-video\');\\n  if (!video) return;\\n  video.muted = true;\\n  video.defaultMuted = true;\\n  video.playsInline = true;\\n  video.autoplay = true;\\n  video.loop = true;\\n  const playButton = document.createElement(\'button\');\\n  playButton.type = \'button\';\\n  playButton.textContent = \'\\u25b6 Play video\';\\n  playButton.setAttribute(\'aria-label\', \'Play the Cantina video\');\\n  playButton.hidden = true;\\n  playButton.style.cssText = \'align-self:center;padding:10px 22px;border:1px solid #e9bc60;border-radius:24px;background:#f6edd9;color:#102b40;font:600 16px Georgia,serif;cursor:pointer\';\\n  video.after(playButton);\\n  let pending = false;\\n  function visible() {\\n    const rect = video.getBoundingClientRect();\\n    return rect.bottom > 0 && rect.top < innerHeight;\\n  }\\n  function resume() {\\n    if (document.hidden || !video.paused || pending) return;\\n    video.muted = true;\\n    // Call play directly inside touch/click handlers to preserve the user gesture.\\n    const attempt = video.play();\\n    if (attempt) {\\n      pending = true;\\n      attempt.then(() => { playButton.hidden = true; })\\n        .catch(() => { playButton.hidden = !visible(); })\\n        .finally(() => { pending = false; });\\n    }\\n  }\\n  video.addEventListener(\'playing\', () => { playButton.hidden = true; });\\n  video.addEventListener(\'canplay\', resume);\\n  video.addEventListener(\'loadeddata\', resume);\\n  window.addEventListener(\'pageshow\', resume);\\n  document.addEventListener(\'visibilitychange\', resume);\\n  document.addEventListener(\'touchend\', resume, { passive: true });\\n  document.addEventListener(\'click\', resume);\\n  playButton.addEventListener(\'click\', resume);\\n  new IntersectionObserver(entries => {\\n    if (entries.some(entry => entry.isIntersecting)) resume();\\n  }, { threshold: 0.1 }).observe(video);\\n  // Mobile Safari may defer an off-screen autoplay video until it is visible.\\n  let scheduled = false;\\n  window.addEventListener(\'scroll\', () => {\\n    if (scheduled) return;\\n    scheduled = true;\\n    requestAnimationFrame(() => {\\n      scheduled = false;\\n      if (visible()) resume();\\n    });\\n  }, { passive: true });\\n  resume();\\n})();\\n", "dist/house-favorites.css": "/* House Favorites, styled to match Dave\'s reference. */\\n.house-favorites{background:radial-gradient(ellipse at 50% 25%,#fffbf0,#f6edd9);color:#222015;text-align:center;padding:28px 5% 30px;border-bottom:1px solid #ddc596}\\n.favorites-ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:#a8833c;margin:0 auto 3px;max-width:440px}\\n.favorites-ornament span{height:1px;background:linear-gradient(90deg,transparent,#a8833c);flex:1}.favorites-ornament span:last-child{transform:rotate(180deg)}.favorites-ornament svg{width:34px;height:27px}\\n.house-favorites h2,.house-favorites h3{font-family:Georgia,\'Times New Roman\',serif!important;color:#211e17!important;text-shadow:none!important;-webkit-text-stroke:0!important;font-weight:700!important;font-style:normal!important;letter-spacing:-.5px!important;line-height:1.1!important}\\n.house-favorites h2{font-size:clamp(34px,4vw,52px);margin:0 0 8px}.favorites-tagline{font:600 12px/1.5 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;margin:0 0 20px}\\n.favorites-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1280px;margin:0 auto 20px}.favorite-card{min-width:0;box-shadow:0 2px 5px #9b79400c;padding:0 0 14px}.favorite-card img{display:block;width:100%;height:auto;aspect-ratio:1.85;object-fit:cover;border:1px solid #d4c7a9}.house-favorites h3{font-size:clamp(23px,2.5vw,32px);margin:8px 0 6px}.favorite-card p{font:15px/1.5 Arial,sans-serif;max-width:290px;margin:0 auto;padding:0 12px;color:#4d493d}\\n.favorites-menu-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:16px 30px;background:linear-gradient(115deg,#ecc66f,#c89338);color:#2e2515;font:700 15px/1.2 Georgia,serif;text-transform:uppercase;letter-spacing:1.4px;border:1px solid #dfb660;box-shadow:0 2px 5px #75501b20}.favorites-menu-link:hover{background:#e7bb61}.favorites-menu-link:focus-visible{outline:3px solid #173f59;outline-offset:4px}\\n@media(max-width:600px){.house-favorites{padding:26px 6% 30px}.favorites-tagline{font-size:10px;letter-spac