-14 29ZM24 33c8-10 15-14 23-16-2 8-10 14-23 16Z\\" fill=\\"currentColor\\"/></svg><span></span></div><h2 id=\\"house-favorites-title\\">House Favorites</h2><p class=\\"favorites-tagline\\">Timeless Mexican flavors. Always a good idea.</p><div class=\\"favorites-grid\\"><article class=\\"favorite-card\\"><img src=\\"review/assets/house-favorites-fajitas.webp\\" width=\\"434\\" height=\\"228\\" alt=\\"Sizzling steak fajitas with colorful peppers and onions\\" loading=\\"lazy\\"><h3>Fajitas</h3><p>Sizzling steak, chicken or shrimp with peppers and onions. A true classic.</p></article><article class=\\"favorite-card\\"><img src=\\"review/assets/house-favorites-tacos.webp\\" width=\\"409\\" height=\\"229\\" alt=\\"Street tacos topped with onions and cilantro, served with lime\\" loading=\\"lazy\\"><h3>Street Tacos</h3><p>Authentic flavors. Fresh ingredients.<br>Always a favorite.</p></article><article class=\\"favorite-card\\"><img src=\\"review/assets/house-favorites-enchiladas.webp\\" width=\\"420\\" height=\\"229\\" alt=\\"Enchiladas with red sauce and melted cheese, served with rice and beans\\" loading=\\"lazy\\"><h3>Enchiladas</h3><p>Rich sauces, melted cheese and traditional recipes done right.</p></article></div><a class=\\"favorites-menu-link\\" href=\\"review/menu.html\\">View Full Menu</a></section>\\n<div class=\\"review-rest\\"><div class=\\"woven\\" aria-hidden=\\"true\\"></div>\\n\\n<div class=\\"woven\\" aria-hidden=\\"true\\"></div>\\n<section class=\\"cantina\\" id=\\"cantina\\"><div class=\\"drink-image cantina-photos\\"><img class=\\"cantina-beer-taps\\" src=\\"review/assets/gallery-beer-taps.webp\\" width=\\"1397\\" height=\\"1126\\" alt=\\"Beer taps in sharp focus against a softly blurred cantina background\\" loading=\\"lazy\\"><video class=\\"cantina-video\\" autoplay muted loop playsinline preload=\\"auto\\" poster=\\"review/assets/cantina-video-poster.webp?v=background-blur-1\\" width=\\"910\\" height=\\"512\\" aria-label=\\"A Fiesta Azteca bartender shaking a cocktail\\"><source src=\\"review/assets/cantina-video.mp4?v=background-blur-1\\" type=\\"video/mp4\\"></video><div class=\\"cantina-margarita-pair\\"><img class=\\"cantina-margarita\\" src=\\"review/assets/cantina-orange-margarita-blurred.webp\\" width=\\"1036\\" height=\\"1519\\" alt=\\"Fiesta Azteca margarita with an orange slice, purple orchid, and salted rim at the cantina bar\\" loading=\\"lazy\\"><img class=\\"cantina-favorites\\" src=\\"review/assets/cantina-favorites-blurred.webp\\" width=\\"1448\\" height=\\"1086\\" alt=\\"Two colorful frozen margaritas in sharp focus against a softly blurred cantina background\\" loading=\\"lazy\\"></div></div><div class=\\"drink-content\\"><p class=\\"eyebrow\\">THE CANTINA</p><h2>A little lime.<br>A lot of<br><em>\\u00a1Salud!</em></h2><p>Relax with your friends in our comfortable Cantina, enjoy an outstanding Margarita, and nibble on one of our famous appetizers.</p><span class=\\"drink-art\\" aria-hidden=\\"true\\">\\u273a</span></div></section>\\n<section class=\\"experience section\\" id=\\"experience\\"><div class=\\"section-heading step-photo-heading\\"><div class=\\"step-photo-grid\\"><div class=\\"step-photo-panel\\"><div class=\\"step-photo-frame\\"><img src=\\"review/assets/gallery-welcome-you.webp\\" width=\\"1514\\" height=\\"1039\\" alt=\\"Two smiling Fiesta Azteca team members at the front desk\\" loading=\\"lazy\\"></div><h2><span class=\\"step-inside-title\\">Step inside.</span><br><em>Feel the fiesta.</em></h2></div><div class=\\"step-photo-panel\\"><div class=\\"step-photo-frame\\"><img src=\\"review/assets/gallery-welcome-fiesta-clean.webp\\" width=\\"1584\\" height=\\"993\\" alt=\\"Fiesta Azteca entrance with the restaurant sign, plants, and front patio\\" loading=\\"lazy\\"></div><p class=\\"step-exterior-copy\\">Rich colors, decorative tile, and a welcoming Mexican setting. A place to gather, linger, and enjoy the moment.</p></div></div></div><div class=\\"atmosphere\\"><div class=\\"inside-photos\\"><button class=\\"photo-button inside-new\\" data-image=\\"review/assets/step-inside-cantina.webp\\" data-caption=\\"Guests gathered around the cantina bar at Fiesta Azteca\\" aria-label=\\"Enlarge Guests gathered around the cantina bar at Fiesta Azteca\\"><img src=\\"review/assets/step-inside-cantina.webp\\" width=\\"1800\\" height=\\"1350\\" alt=\\"Guests gathered around the cantina bar at Fiesta Azteca\\" loading=\\"lazy\\"><span>TAKE A CLOSER LOOK \\u2197</span></button><button class=\\"photo-button inside-new\\" data-image=\\"review/assets/step-inside-fiesta.webp\\" data-caption=\\"Colorful papel picado banners and guests inside Fiesta Azteca\\" aria-label=\\"Enlarge Colorful papel picado banners and guests inside Fiesta Azteca\\"><img src=\\"review/assets/step-inside-fiesta.webp\\" width=\\"960\\" height=\\"720\\" alt=\\"Colorful papel picado banners and guests inside Fiesta Azteca\\" loading=\\"lazy\\"><span>TAKE A CLOSER LOOK \\u2197</span></button></div><div class=\\"gather\\"><h3>Bring the<br>whole table.</h3><p>Planning a get-together? Large groups are welcome, and catering is available. Give us a call to talk through your plans.</p><span class=\\"gather-sun\\" aria-hidden=\\"true\\">\\u2600</span></div></div></section>\\n<section class=\\"social-band\\"><a class=\\"facebook-corner-logo\\" href=\\"https://www.facebook.com/fiestaaztecaofsuntree/\\" aria-label=\\"Fiesta Azteca of Suntree on Facebook\\"><svg xmlns=\\"http://www.w3.org/2000/svg\\" viewBox=\\"0 0 16 16\\" aria-hidden=\\"true\\" focusable=\\"false\\"><path fill=\\"currentColor\\" d=\\"M16 8.049C16 3.603 12.418 0 8 0S0 3.603 0 8.049c0 4.017 2.926 7.347 6.75 7.951v-5.625H4.719V8.049H6.75V6.276c0-2.017 1.194-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.994 0-1.304.621-1.304 1.258v1.509h2.219l-.355 2.326H9.25V16C13.074 15.396 16 12.066 16 8.049Z\\"/></svg></a><span class=\\"eyebrow\\">KEEP UP WITH THE FIESTA</span><h2><span class=\\"whats-happening-title\\">What\\u2019s happening</span><br><em>at Fiesta?</em></h2><p>Visit our Facebook page for the latest posts,<br>restaurant updates, and a little more fiesta.</p><a class=\\"button outline\\" href=\\"https://www.facebook.com/fiestaaztecaofsuntree/\\" target=\\"_blank\\" rel=\\"noopener\\">Find us on Facebook \\u2197</a></section>\\n<div class=\\"woven\\" aria-hidden=\\"true\\"></div>\\n<section class=\\"visit section\\" id=\\"visit\\"><div class=\\"visit-map-background\\" aria-hidden=\\"true\\"><iframe title=\\"Map showing Fiesta Azteca of Suntree\\" src=\\"https://maps.google.com/maps?cid=18075285883047673838&amp;ll=28.2213996%2C-80.6758325&amp;z=16&amp;output=embed\\" loading=\\"lazy\\" tabindex=\\"-1\\" referrerpolicy=\\"no-referrer-when-downgrade\\"></iframe></div><div><p class=\\"eyebrow visit-tagline\\">YOUR NEXT FIESTA STARTS HERE</p><h2><span class=\\"come-hungry-title\\">Come hungry.</span><br><em>Leave happy.</em></h2><p class=\\"visit-intro\\">Fiesta Azteca of Suntree<br>Mexican food. Space Coast spirit.</p></div><div class=\\"visit-details\\"><div><span class=\\"eyebrow\\">FIND US</span><address>6765 N Wickham Rd, Suite 100<br>Melbourne, FL 32940</address><a class=\\"text-link\\" href=\\"https://www.google.com/maps/search/?api=1&amp;query=Fiesta+Azteca+of+Suntree&amp;query_place_id=ChIJ07CbmvgE3ogR7n-wYL5Q2Po\\" aria-label=\\"Find Fiesta Azteca of Suntree in Google Maps\\">Get directions \\u2197</a></div><div><span class=\\"eyebrow\\">GIVE US A CALL</span><a class=\\"phone\\" href=\\"tel:+13212552185\\">(321) 255-2185</a><p>Call for current hours, menus,<br>group dining, and catering.</p></div></div></section>\\n<footer><a class=\\"brand\\" href=\\"#top\\"><img class=\\"brand-logo\\" src=\\"review/assets/fiesta-azteca-agave-logo.webp\\" alt=\\"Fiesta Azteca Mexican Restaurants\\" width=\\"2172\\" height=\\"724\\"><span>FIESTA AZTECA<small>OF SUNTREE</small></span></a><p>Un poquito de M\\u00e9xico. Right here in Suntree.</p><small>\\u00a9 <span id=\\"year\\">2026</span