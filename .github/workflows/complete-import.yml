nt.querySelector(\'.review-rest #lightbox\');if(!modal)return;document.querySelectorAll(\'.review-rest [data-image]\').forEach(button=>button.addEventListener(\'click\',()=>{const img=modal.querySelector(\'img\');img.src=button.dataset.image;img.alt=button.dataset.caption||\'\';modal.querySelector(\'p\').textContent=button.dataset.caption||\'\';modal.showModal()}));modal.querySelector(\'.close\').addEventListener(\'click\',()=>modal.close());modal.addEventListener(\'click\',event=>{if(event.target===modal)modal.close()})})();", "dist/home.css": ":root{--cream:#f2ecdc;--ink:#19231d;--yellow:#f3be49;--rust:#b64b2f;--muted:#c1c4b7}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:20px}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}img{display:block;width:100%;object-fit:cover}h1,h2,p,figure{margin:0}.topline{background:var(--yellow);padding:10px 4.5%;display:flex;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:1.2px}.site-header{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--cream);padding:17px 4.5%;gap:30px}.wordmark{display:flex;align-items:center;gap:15px;font-family:Georgia,serif;font-size:23px;font-weight:700;letter-spacing:1px;white-space:nowrap}.wordmark img{width:63px;height:63px;border-radius:50%}.wordmark small{display:block;font:9px Arial;letter-spacing:5px;margin-top:7px}nav{display:flex;align-items:center;gap:28px;font-size:12px}nav a:hover{color:var(--yellow)}.nav-cta{padding:15px 22px;border:1px solid #c6c6af90;font-size:10px;font-weight:bold;letter-spacing:1px}.nav-toggle{display:none}.film-hero{position:relative;min-height:710px;height:calc(100svh - 140px);max-height:1000px;overflow:hidden;color:var(--cream);background:#201c13;display:flex;align-items:center}.film-hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-shade{pos