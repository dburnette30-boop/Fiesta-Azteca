          def transfer(entry):
              path, expected = entry['path'], entry['sha']
              if path in INLINE:
                  data = INLINE[path].encode()
              else:
                  for attempt in range(4):
                      try:
                          data = urllib.request.urlopen(urllib.request.Request(BASE + path.removeprefix('dist/'), headers={'User-Agent': 'Mozilla/5.0'}), timeout=90).read()
                          break
                      except Exception:
                          if attempt == 3: raise
                          time.sleep(2)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, f'Source mismatch: {path}: {actual} != {expected}'
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              return len(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              sizes = list(pool.map(transfer, ENTRIES))
          print(f'Verified {len(sizes)} original files, {sum(sizes)} bytes against Sites version 115')
          Path('README.md').write_text('# Fiesta Azteca — Dave’s Copy\n\nComplete original source from Sites version 115, commit `30e61fb8a2ec65702a1f32b31c1bb4d7cd4c84da`.\n\nThe website is in `dist/`. All 201 original source files were verified by Git blob hash during import.\n')
          Path('.github/workflows/complete-import.yml').unlink()
