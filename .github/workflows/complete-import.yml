xisting terracotta below. */\\n.experience{background:#8e3f2d}\\n.experience .section-heading::before{opacity:1;background-image:linear-gradient(to bottom,#8e3f2d00 0%,#8e3f2d00 45%,#8e3f2d0d 55%,#8e3f2d66 76%,#8e3f2d 100%),url(\'assets/gallery-colorful-dining-room.jpeg\');-webkit-mask-image:none;mask-image:none}\\n.experience .section-heading h2,.experience .section-heading p{text-shadow:0 2px 10px #421f1899}\\n}\\n.review-rest{display:flow-root}\\n\\n@scope (.review-rest){\\n\\n/* Interior and exterior photographs, softly blended side by side. */\\n.experience .section-heading{min-height:460px}\\n.experience .section-heading::before,.experience .section-heading::after{content:\\"\\";position:absolute;top:-40px;bottom:-20px;width:56%;height:auto;z-index:-1;pointer-events:none;opacity:1;background-repeat:no-repeat;background-position:center;background-size:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 80%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 58%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 80%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 58%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}\\n.experience .section-heading::before{left:-4%;right:auto;background-image:url(\'assets/restaurant-interior-enhanced.png\')}\\n.experience .section-heading::after{left:auto;right:-4%;background-image:url(\'assets/restaurant-exterior-enhanced.png\');background-size:contain}\\n@media(max-width:800px){.experience .section-heading{min-height:570px}.experience .section-heading::before,.experience .section-heading::after{top:-15px;bottom:auto;height:370px;width:56%;background-position:center;background-size:cover}.experience .section-heading::after{background-size:contain}}\\n\\n}\\n\\n@scope (.review-rest){.experience .section-heading::after{right:2%;width:42%;background-size:cover;background-position:center 28%}\\n@media(max-width:800px){.experience .sect