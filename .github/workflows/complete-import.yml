a-evening .musica-page a:focus-visible{outline-color:#f5d28f}\\n@media(max-width:600px){.musica-evening{background-image:radial-gradient(ellipse at 0% 15%,#962e3528,transparent 48%),radial-gradient(ellipse at 100% 30%,#176c4c28,transparent 48%),radial-gradient(ellipse at 50% 22%,#d99a3c1c,transparent 64%)}}\\n\\n/* Bright green, white and red Mexican tile for the gallery. */\\n.gallery-tiles{background-color:#fffefa;background-image:linear-gradient(#302b2866,#302b2866),url(\'assets/gallery-mexican-tile.svg\');background-repeat:repeat;background-size:auto,288px 288px}\\n.gallery-tiles .gallery-page>.eyebrow{display:table;margin:0 auto 18px;padding:10px 18px;background:#fffefa;border:2px solid #00854b;border-radius:5px;text-align:center;color:#006b3e}\\n.gallery-tiles .gallery-page>h1{display:table;margin:0 auto;padding:16px 32px 20px;background:#a51e29;border:3px solid #fffefa;border-radius:12px;box-shadow:0 4px 16px #143d2b30;text-align:center}\\n.gallery-tiles .gallery-grid figure{padding:10px 10px 16px;background:var(--heading-gold);border:2px solid var(--heading-gold);border-radius:15px;box-shadow:0 5px 16px #143d2b38}\\n.gallery-tiles .gallery-grid .photo-button{border-color:var(--heading-gold)}\\n.gallery-tiles .gallery-grid figcaption{color:#102b40;text-align:center;margin:12px 8px 0}\\n.gallery-tiles .team-home-logo{background:#fffefa;border-radius:50%;box-shadow:0 4px 16px #143d2b38}\\n@media(max-width:600px){.gallery-tiles{background-size:auto,216px 216px}.gallery-tiles .gallery-grid{gap:24px}.gallery-tiles .gallery-grid figure{padding:7px 7px 14px}.gallery-tiles .gallery-page>h1{padding:14px 26px 18px}}\\n\\n/* Let the people show clearly, then blend smoothly into solid green. */\\n.flavors{background:#174c3c}\\n.flavors .section-heading::before{opacity:1;background-image:linear-gradient(to bottom,#174c3c12 0%,#174c3c26 28%,#174c3c80 58%,#174c3c 100%),url(\'../assets/mariachi-guitar-closeup.webp\');-webkit-mask-image:none;mask-image:none}\\n.flavors .section-heading h2,.flavors .section-heading p{text-shadow:0 2px 10px #102b2499}\\n\\n/* Step Inside: clear people above, fading into the existing terracotta below. */\\n.experience{background:#8e3f2d}\\n.experience .section-heading::before{opacity:1;background-image:linear-gradient(to bottom,#8e3f2d00 0%,#8e3f2d00 45%,#8e3f2d0d 55%,#8e3f2d66 76%,#8e3f2d 100%),url(\'assets/gallery-colorful-dining-room.jpeg\');-webkit-mask-image:none;mask-image:none}\\n.experience .section-heading h2,.experience .section-heading p{text-shadow:0 2px 10px #421f1899}\\n\\n/* Interior and exterior photographs, softly blended side by side. */\\n.experience .section-heading{min-height:460px}\\n.experience .section-heading::before,.experience .section-heading::after{content:\\"\\";position:absolute;top:-40px;bottom:-20px;width:56%;height:auto;z-index:-1;pointer-events:none;opacity:1;background-repeat:no-repeat;background-position:center;background-size:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 80%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 58%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 80%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 58%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}\\n.experience .section-heading::before{left:-4%;right:auto;background-image:url(\'assets/restaurant-interior-enhanced.png\')}\\n.experience .section-heading::after{left:auto;right:-4%;background-image:url(\'assets/restaurant-exterior-enhanced.png\');background-size:contain}\\n@media(max-width:800px){.experience .section-heading{min-height:570px}.experience .section-heading::before,.experience .section-heading::after{top:-15px;bottom:auto;height:370px;width:56%;background-position:center;background-size:cover}.experience .section-heading::after{background-size:contain}}\\n.experience .section-heading::after{right:2%;width:42%;background-size:cover;background-position:center 28%}\\n@media(max-width:800px){.experience .section-heading::after{right:0;width:48%;background-size:cover;background-position:center}}\\n\\n/* Agave artwork stays behind the gallery as visitors browse the photos. */\\n.gallery-tiles{background:#102534;position:relative;isolation:isolate}\\n.gallery-tiles::before{content:\\"\\";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(#08172540,#08172570),url(\'assets/gallery-agave-fields.webp\') center center/cover no-repeat}\\n\\n/* Musica uses the deep agave blue sampled from the logo. */\\n.musica-evening{background-color:#104060;background-image:none}\\n.musica-evening .musica-page{background:none}\\n\\n/* Lighter blue from the agave logo behind the Gallery title. */\\n.gallery-tiles .gallery-page>h1{background:#387898}\\n\\n/* The welcome frame follows the photograph; the caption sits below it. */\\n.gallery-tiles .gallery-grid figure.gallery-photo-only{align-self:start;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}\\n.gallery-tiles .gallery-grid .gallery-photo-only .photo-button{border:10px solid var(--heading-gold);border-radius:15px;box-shadow:0 5px 16px #143d2b38;line-height:0}\\n.gallery-tiles .gallery-grid .gallery-photo-only img{display:block;width:100%;height:auto;aspect-ratio:auto;object-fit:contain}\\n.gallery-tiles .gallery-grid .gallery-photo-only figcaption{color:var(--heading-gold);margin:12px 8px 0;text-shadow:0 2px 4px #081725}\\n@media(max-width:600px){.gallery-tiles .gallery-grid .gallery-photo-only .photo-button{border-width:7px}}\\n", "dist/review/gallery-layout.js": "(() => {\\n  const grid = document.querySelector(\'.gallery-grid\');\\n  if (!grid) return;\\n  const photos = [...grid.children];\\n  let pending;\\n  const layout = () => {\\n    cancelAnimationFrame(pending);\\n    pending = requestAnimationFrame(() => {\\n      const stacked = getComputedStyle(grid).display !== \'grid\';\\n      photos.forEach(photo => {\\n        photo.style.gridRowEnd = stacked ? \'\' : `span ${Math.ceil(photo.getBoundingClientRect().height + 16)}`;\\n      });\\n    });\\n  };\\n  const observer = new ResizeObserver(layout);\\n  photos.forEach(photo => observer.observe(photo));\\n  grid.querySelectorAll(\'img\').forEach(img => img.addEventListener(\'load\', layout));\\n  document.fonts.ready.then(layout);\\n  window.addEventListener(\'resize\', layout);\\n  layout();\\n})();\\n", "dist/review/opening.css": "/* One-shot fajita fire opening; the original home remains underneath. */\\n.fajita-opening{position:fixed;inset:0;z-index:1000;background:#130b07;overflow:hidden;opacity:1;transition:opacity 1.2s ease;pointer-events:auto}\\n.fajita-opening[hidden]{display:none}\\n.fajita-opening.is-clearing{opacity:0;pointer-events:none}\\n.fajita-opening__grill{width:100%;height:100%;object-fit:cover;object-position:center 58%;transform:scale(1.025);animation:grill-approach 4.4s linear both}\\n.fajita-opening__shade{position:absolute;inset:0;background:linear-gradient(0deg,#12070080,transparent 55%,#09040240)}\\n.fajita-opening canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}\\n.fajita-opening__skip{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));padding:12px 19px;border:1px solid #fff8d780;border-radius:30px;background:#180c07a6;color:#fff8e7;font:14px Arial,sans-serif;cursor:pointer;z-index:2}\\n.fajita-opening__skip:focus-visible{outline:3px solid #fff;outline-offset:4px}\\n.hero-beer.margarita-reveal{animation:margarita-reveal 1.6s ease-out both}\\n@keyframes grill-approach{to{transform:scale(1.1)}}\\n@keyframes margarita-reveal{from{opacity:.15;filter:blur(7px);transform:scale(.97)}to{opacity:1;filter:blur(0);transform:scale(1)}}\\n@media(max-width:600px){.fajita-opening__grill{object-position:50% 58%}}\\n@media(prefers-reduced-motion:reduce){.fajita-opening{display:none}.hero-beer.margarita-reveal{animation:none}}\\n\\n/* Cover the viewport from the first paint, including the scrollbar area. */\\nhtml.intro-pending,html.intro-pending body{overflow:hidden}\\nhtml.intro-pending .fajita-opening[hidden]{display:block}\\n.fajita-opening{width:100vw;height:100vh;height:100dvh}\\n.fajita-opening__grill{position:absolute;inset:0;max-width:none;min-width:100%;min-height:100%}\\n\\n/* A broad translucent silver halo follows the glass as the fire clears. */\\n.margarita-silver-flash{filter:blur(5px);position:fixed;z-index:1001;pointer-events:none;overflow:visible;opacity:0;animation:silver-glass-flash 3.2s .9s ease-out both}\\n.margarita-silver-flash path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-dashoffset:0}\\n@keyframes silver-glass-flash{0%{opacity:0}6%{opacity:1}78%{opacity:1}100%{opacity:0}}\\n@keyframes silver-glass-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}\\n@media(prefers-reduced-motion:reduce){.margarita-silver-flash{display:none}}\\n", "dist/review/script.js": "const toggle=document.querySelector(\'.menu-toggle\'),nav=document.querySelector(\'nav\');toggle.addEventListener(\'click\',()=>{const opened=toggle.getAttribute(\'aria-expanded\')!==\'true\';toggle.setAttribute(\'aria-expanded\',opened);toggle.setAttribute(\'aria-label\',opened?\'Close navigation\':\'Open navigation\');nav.classList.toggle(\'open\',opened)});nav.querySelectorAll(\'a\').forEach(a=>a.addEventListener(\'click\',()=>{nav.classList.remove(\'open\');toggle.setAttribute(\'aria-expanded\',\'false\');toggle.setAttribute(\'aria-label\',\'Open navigation\')}));const modal=document.querySelector(\'#lightbox\');document.querySelectorAll(\'[data-image]\').forEach(b=>b.addEventListener(\'click\',()=>{modal.querySelector(\'img\').src=b.dataset.image;modal.querySelector(\'img\').alt=b.dataset.caption;modal.querySelector(\'p\').textContent=b.dataset.caption;modal.showModal()}));modal?.querySelector(\'.close\').addEventListener(\'click\',()=>modal.close());modal?.addEventListener(\'click\',e=>{if(e.target===modal)modal.close()});const year=document.querySelector(\'#year\');if(year)year.textContent=new Date().getFullYear();\\n\\n// Close phone navigation with Escape or a tap outside the header.\\nfunction closeNavigation(){nav.classList.remove(\\"open\\");toggle.setAttribute(\\"aria-expanded\\",\\"false\\");toggle.setAttribute(\\"aria-label\\",\\"Open navigation\\")}\\ndocument.addEventListener(\\"keydown\\",e=>{if(e.key===\\"Escape\\"&&nav.classList.contains(\\"open\\")){closeNavigation();toggle.focus()}});document.addEventListener(\\"click\\",e=>{if(nav.classList.contains(\\"open\\")&&!e.target.closest(\\"header\\"))closeNavigation()});\\n\\n// Return home immediately and expose navigation on phones and tablets.\\nfunction returnToHomeNavigation(){\\n  window.scrollTo({top:0,left:0,behavior:\'instant\'});\\n  if(getComputedStyle(toggle).display!==\'none\'){\\n    nav.classList.add(\'open\');\\n    toggle.setAttribute(\'aria-expanded\',\'true\');\\n    toggle.setAttribute(\'aria-label\',\'Close navigation\');\\n  }\\n}\\ndocument.querySelectorAll(\'a[href=\\"#top\\"],a[href=\\"#home\\"]\').forEach(link=>{\\n  link.addEventListener(\'click\',event=>{\\n    if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;\\n    event.preventDefault();\\n    event.stopPropagation();\\n    history.replaceState(null,\'\',\'#top\');\\n    returnToHomeNavigation();\\n  });\\n});\\nwindow.addEventListener(\'pageshow\',()=>{\\n  if(document.body.id===\'top\'&&(location.hash===\'#top\'||location.hash===\'#home\'))returnToHomeNavigation();\\n});\\n", "dist/review/gallery-layout.css": "/* Compact natural-height cards with a little space between gold frames. */\\n.gallery-tiles .gallery-grid{column-gap:16px;row-gap:0;grid-auto-rows:1px;align-items:start}\\n.gallery-tiles .gallery-grid figure{margin:0;align-self:start;padding:10px 10px 16px;background:var(--heading-gold);border:2px solid var(--heading-gold);border-radius:15px;overflow:hidden}\\n.gallery-tiles .gallery-grid figcaption{color:#102b40;text-align:center;margin:12px 8px 0;overflow-wrap:anywhere;text-shadow:none}\\n@media(max-width:760px){.gallery-tiles .gallery-grid{display:block}.gallery-tiles .gallery-grid figure{margin:0 0 16px;padding:7px 7px 14px}.gallery-tiles .gallery-grid figure:last-child{margin-bottom:0}}\\n\\n/* Leave a clear view of the sun above the gallery title. */\\n.gallery-tiles::before{top:152px;background-image:linear-gradient(to bottom,#08172500 0%,#0817250a 28%,#08172570 75%),url(\'assets/gallery-agave-fields.webp\');background-position:center top}\\n.gallery-tiles .gallery-page{padding-top:140px}\\n@media(max-width:1100px){.gallery-tiles::before{top:124px}}\\n\\n/* Add 20 pixels between the Gallery heading and the photos. */\\n.gallery-tiles .gallery-grid{margin-top:56px}\\n", "dist/review/menu-viewer.js": "const menuViewer = document.querySelector(\'#menu-viewer\');\\nconst menuImage = menuViewer.querySelector(\'img\');\\nconst menuPan = menuViewer.querySelector(\'.menu-pan\');\\nlet menuScroll = 0, menuTrigger, lastTap = null, pointerStart = null;\\nfunction closeMenuViewer() { if (menuViewer.open) menuViewer.close(); }\\ndocument.querySelectorAll(\'.menu-image, .menu-photos figcaption > a\').forEach(link => {\\n  link.addEventListener(\'click\', event => {\\n    event.preventDefault();\\n    menuTrigger = link;\\n    menuScroll = window.scrollY;\\n    menuImage.src = link.getAttribute(\'href\');\\n    menuImage.alt = link.closest(\'figure\').querySelector(\'img\').alt;\\n    lastTap = null;\\n    menuViewer.showModal();\\n    document.body.style.position = \'fixed\';\\n    document.body.style.top = `-${menuScroll}px`;\\n    document.body.style.width = \'100%\';\\n    menuPan.scrollTop = menuPan.scrollLeft = 0;\\n  });\\n});\\nmenuViewer.querySelector(\'.close-menu\').addEventListener(\'click\', closeMenuViewer);\\nmenuViewer.addEventListener(\'close\', () => {\\n  document.body.style.position = \'\';\\n  document.body.style.top = \'\';\\n  document.body.style.width = \'\';\\n  menuTrigger?.focus({preventScroll: true});\\n  window.scrollTo({top: menuScroll, behavior: \'instant\'});\\n  lastTap = pointerStart = null;\\n});\\nmenuImage.addEventListener(\'dblclick\', event => { event.preventDefault(); closeMenuViewer(); });\\nmenuImage.addEventListener(\'pointerdown\', event => {\\n  if (!event.isPrimary) { pointerStart = lastTap = null; return; }\\n  pointerStart = {x:event.clientX,y:event.clientY,time:event.timeStamp};\\n});\\nmenuImage.addEventListener(\'pointercancel\', () => { pointerStart = lastTap = null; });\\nmenuImage.addEventListener(\'pointerup\', event => {\\n  if (event.pointerType === \'mouse\' || !pointerStart) return;\\n  const start = pointerStart; pointerStart = null;\\n  if (event.timeStamp-start.time > 300 || Math.hypot(event.clientX-start.x,event.clientY-start.y)>12) { lastTap=null; return; }\\n  if (lastTap && event.timeStamp-lastTap.time<350 && Math.hypot(event.clientX-lastTap.x,event.clientY-lastTap.y)<32) {\\n    event.preventDefault(); closeMenuViewer();\\n  } else lastTap={time:event.timeStamp,x:event.clientX,y:event.clientY};\\n});\\n", "dist/review/our-team.html": "<!doctype html>\\n<html lang=\\"en\\"><head><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\"><meta name=\\"theme-color\\" content=\\"#102f47\\"><title>Our Team \\u2014 Fiesta Azteca of Suntree</title><meta name=\\"description\\" content=\\"Meet the team at Fiesta Azteca of Suntree.\\"><link rel=\\"stylesheet\\" href=\\"style.css?v=backgrounds-116\\"><link rel=\\"stylesheet\\" href=\\"../phone.css\\"><link rel=\\"stylesheet\\" href=\\"../logo.css?v=agave-logo-2\\"><link rel=\\"stylesheet\\" href=\\"../headings.css?v=agave-script-1\\"><link rel=\\"stylesheet\\" href=\\"../separators-blue-v4.css?v=removed-1\\"><link rel=\\"stylesheet\\" href=\\"../agave-header.css?v=3\\"><link rel=\\"stylesheet\\" href=\\"../team-agave.css?v=1\\"></head>\\n<body class=\