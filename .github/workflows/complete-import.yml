eight=\\"700\\">T</text></g><g class=\\"hanging-banner\\" transform=\\"translate(785 73)\\" fill=\\"#b88b48\\"><use href=\\"#p\\"/><text x=\\"50\\" y=\\"43\\" text-anchor=\\"middle\\" fill=\\"#faf3df\\" font-family=\\"Georgia,serif\\" font-size=\\"43\\" font-weight=\\"700\\">E</text></g><g class=\\"hanging-banner\\" transform=\\"translate(1015 58)\\" fill=\\"#a7392e\\"><use href=\\"#p\\"/><text x=\\"50\\" y=\\"43\\" text-anchor=\\"middle\\" fill=\\"#faf3df\\" font-family=\\"Georgia,serif\\" font-size=\\"43\\" font-weight=\\"700\\">C</text></g><g class=\\"hanging-banner\\" transform=\\"translate(1245 27)\\" fill=\\"#174c3c\\"><use href=\\"#p\\"/><text x=\\"50\\" y=\\"43\\" text-anchor=\\"middle\\" fill=\\"#faf3df\\" font-family=\\"Georgia,serif\\" font-size=\\"43\\" font-weight=\\"700\\">A</text></g></svg><div class=\\"arch\\" aria-hidden=\\"true\\"></div><div class=\\"arch-florals\\" aria-hidden=\\"true\\"><img class=\\"floral-vine floral-left\\" src=\\"assets/arch-florals.svg\\" alt=\\"\\" width=\\"140\\" height=\\"760\\"><img class=\\"floral-vine floral-right\\" src=\\"assets/arch-florals.svg\\" alt=\\"\\" width=\\"140\\" height=\\"760\\"></div><div class=\\"hero-content\\"><img class=\\"hero-beer\\" src=\\"assets/cantina-margarita.webp\\" alt=\\"Golden margarita in a Fiesta Azteca glass at the cantina bar\\" width=\\"2048\\" height=\\"1536\\" fetchpriority=\\"high\\"><p class=\\"eyebrow\\">BIENVENIDOS \\u00b7 SUNTREE, FLORIDA</p><h1><span class=\\"taste-mexico\\">The taste of Mexico.</span><br><em>The spirit of fiesta.</em></h1><p class=\\"hero-copy\\">Bold flavors. Colorful surroundings.<br>Make a little room for celebration.</p></div></section>\\n<div class=\\"woven\\" aria-hidden=\\"true\\"></div>\\n<section class=\\"flavors section\\" id=\\"flavors\\"><div class=\\"section-heading\\"><div><p class=\\"eyebrow\\">FROM THE TABLE</p><h2>Big flavor.<br><em>Every bite.</em></h2></div><p>A little sizzle. A little spice.<br>A table worth gathering around.</p></div><div class=\\"food-grid\\"><article class=\\"food-card\\"><button class=\\"photo-button\\" data-image=\\"assets/restaurant-entree.webp\\" data-caption=\\"A Mexican entr\\u00e9e at Fiesta Azteca of Suntree\\" aria-label=\\"Enlarge Mexican entr\\u00e9e photo\\"><img src=\\"assets/restaurant-entree.webp\\" width=\\"1824\\" height=\\"1368\\" alt=\\"Cheese-topped Mexican entr\\u00e9e with rice, beans, and guacamole\\" loading=\\"lazy\\"><span>VIEW PHOTO \\u2197</span></button><div class=\\"card-title\\"><span>FROM OUR KITCHEN</span><h3><strong>Enchiladas!</strong></h3></div><p>Rice, beans, and all the fixings.</p></article><article class=\\"food-card\\"><button class=\\"photo-button\\" data-image=\\"assets/restaurant-tacos-new.webp\\" data-caption=\\"Tacos at Fiesta Azteca of Suntree\\" aria-label=\\"Enlarge tacos photo\\"><img src=\\"assets/restaurant-tacos-new.webp\\" width=\\"1235\\" height=\\"888\\" alt=\\"Three tacos topped with meat, onions, cilantro, and red salsa\\" loading=\\"lazy\\"><span>VIEW PHOTO \\u2197</span></button><div class=\\"card-title\\"><span>TACO TIME</span><h3>Tacos, Fiesta style</h3></div><p>Bold toppings, fresh flavor, and a little taste of Mexico.</p></article></div></section>\\n<div class=\\"woven\\" aria-hidden=\\"true\\"></div>\\n<section class=\\"cantina\\" id=\\"cantina\\"><div class=\\"drink-image\\"><img src=\\"assets/cantina-orange-margarita-blurred.webp\\" width=\\"1036\\" height=\\"1519\\" alt=\\"Fiesta Azteca margarita with an orange slice, purple orchid, and salted rim at the cantina bar\\" loading=\\"lazy\\"></div><div class=\\"drink-content\\"><p class=\\"eyebrow\\">THE CANTINA</p><h2>A little lime.<br>A lot of<br><em>\\u00a1Salud!</em></h2><p>Relax with your friends in our comfortable Cantina, enjoy an outstanding Margarita, and nibble on one of our famous appetizers.</p><span class=\\"drink-art\\" aria-hidden=\\"true\\">\\u273a</span></div></section>\\n<section class=\\"experience section\\" id=\\"experience\\"><div class=\\"section-heading\\"><div><h2><span class=\\"step-inside-title\\">Step inside.</span><br><em>Feel the fiesta.</em></h2></div><p>Rich colors, decorative tile, and a welcoming Mexican setting. A place to gather, linger, and enjoy the moment.</p></div><div class=\\"atmosphere\\"><div class=\\"inside-photos\\"><button class=\\"photo-button interior\\" data-image=\\"assets/front-desk-enhanced.png\\" data-caption=\\"The tiled front desk at Fiesta Azteca of Suntree\\" aria-label=\\"View the restaurant front desk\\"><img src=\\"assets/front-desk-enhanced.png\\" width=\\"1024\\" height=\\"1536\\" style=\\"aspect-ratio:2/3;object-fit:contain\\" alt=\\"Fiesta Azteca front desk with decorative tile and a sun motif\\" loading=\\"lazy\\"><span>TAKE A CLOSER LOOK \\u2197</span></button><button class=\\"photo-button inside-new\\" data-image=\\"assets/step-inside-cantina.webp\\" data-caption=\\"Guests gathered around the cantina bar at Fiesta Azteca\\" aria-label=\\"Enlarge Guests gathered around the cantina bar at Fiesta Azteca\\"><img src=\\"assets/step-inside-cantina.webp\\" width=\\"1800\\" height=\\"1350\\" alt=\\"Guests gathered around the cantina bar at Fiesta Azteca\\" loading=\\"lazy\\"><span>TAKE A CLOSER LOOK \\u2197</span></button><button class=\\"photo-button inside-new\\" data-image=\\"assets/step-inside-fiesta.webp\\" data-caption=\\"Colorful papel picado banners and guests inside Fiesta Azteca\\" aria-label=\\"Enlarge Colorful papel picado banners and guests inside Fiesta Azteca\\"><img src=\\"assets/step-inside-fiesta.webp\\" width=\\"960\\" height=\\"720\\" alt=\\"Colorful papel picado banners and guests inside Fiesta Azteca\\" loading=\\"lazy\\"><span>TAKE A CLOSER LOOK \\u2197</span></button></div><div class=\\"gather\\"><h3>Bring the<br>whole table.</h3><p>Planning a get-together? Large groups are welcome, and catering is available. Give us a call to talk through your plans.</p><span class=\\"gather-sun\\" aria-hidden=\\"true\\">\\u2600</span></div></div></section>\\n<section class=\\"social-band\\"><a class=\\"facebook-corner-logo\\" href=\\"https://www.facebook.com/fiestaaztecaofsuntree/\\" aria-label=\\"Fiesta Azteca of Suntree on Facebook\\"><svg xmlns=\\"http://www.w3.org/2000/svg\\" viewBox=\\"0 0 16 16\\" aria-hidden=\\"true\\" focusable=\\"false\\"><path fill=\\"currentColor\\" d=\\"M16 8.049C16 3.603 12.418 0 8 0S0 3.603 0 8.049c0 4.017 2.926 7.347 6.75 7.951v-5.625H4.719V8.049H6.75V6.276c0-2.017 1.194-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.994 0-1.304.621-1.304 1.258v1.509h2.219l-.355 2.326H9.25V16C13.074 15.396 16 12.066 16 8.049Z\\"/></svg></a><span class=\\"eyebrow\\">KEEP UP WITH THE FIESTA</span><h2><span class=\\"whats-happening-title\\">What\\u2019s happening</span><br><em>at Fiesta?</em></h2><p>Visit our Facebook page for the latest posts,<br>restaurant updates, and a little more fiesta.</p><a class=\\"button outline\\" href=\\"https://www.facebook.com/fiestaaztecaofsuntree/\\" target=\\"_blank\\" rel=\\"noopener\\">Find us on Facebook \\u2197</a></section>\\n<div class=\\"woven\\" aria-hidden=\\"true\\"></div>\\n<section class=\\"visit section\\" id=\\"visit\\"><div class=\\"visit-map-background\\" aria-hidden=\\"true\\"><iframe title=\\"Map showing Fiesta Azteca of Suntree\\" src=\\"https://maps.google.com/maps?cid=18075285883047673838&amp;ll=28.2213996%2C-80.6758325&amp;z=16&amp;output=embed\\" loading=\\"lazy\\" tabindex=\\"-1\\" referrerpolicy=\\"no-referrer-when-downgrade\\"></iframe></div><div><p class=\\"eyebrow visit-tagline\\">YOUR NEXT FIESTA STARTS HERE</p><h2><span class=\\"come-hungry-title\\">Come hungry.</span><br><em>Leave happy.</em></h2><p class=\\"visit-intro\\">Fiesta Azteca of Suntree<br>Mexican food. Space Coast spirit.</p></div><div class=\\"visit-details\\"><div><span class=\\"eyebrow\\">FIND US</span><address>6765 N Wickham Rd, Suite 100<br>Melbourne, FL 32940</address><a class=\\"text-link\\" href=\\"https://www.google.com/maps/search/?api=1&amp;query=Fiesta+Azteca+