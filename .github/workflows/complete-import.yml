          INLINE = json.loads('{".openai/hosting.json": "{\\n  \\"project_id\\": \\"appgprj_6ae0c787345081918c83368a9421f271\\",\\n  \\"static\\": {\\n    \\"directory\\": \\"dist\\"\\n  }\\n}\\n", "README-DAVE.txt": "FIESTA AZTECA OF SUNTREE \\u2014 REDESIGNED WEBSITE\\nPrepared October 26, 2026 for Sheri to hand off to Dave.\\n\\nThe website folder contains the complete static site. Open index.html for a local look, or serve that folder with any static web server. No build, dependencies, API keys, or accounts are needed.\\n\\nTO PUBLISH\\nUpload the contents of website/ to your hosting public directory, or replace the files in your existing Site source and publish through your normal workflow. Retain the folder structure. The original Site has not been changed.\\n\\nWHAT CHANGED\\nEntirely new homepage: full-bleed grilling-video hero, bold cream/yellow typography, dark cantina section, real restaurant food/drink/interior photographs, clearer navigation and visiting information. AI people backgrounds have been removed. The original restaurant pages and menu viewer remain available with a coordinated navigation header.\\n\\nVIDEO\\nassets/fajitas-grilling.mp4 is the supplied six-second video. It loops silently, plays inline, has a still-image poster and pause/play control, and respects reduced-motion preferences. The original is 640 x 360; a higher-resolution replacement would look sharper on large screens. Replace the file at the same path to upgrade it.\\n\\nEDITING\\nindex.html: new homepage and video hero.\\nhome.css: complete homepage design and responsive layouts.\\nhome.js: hero video controls and mobile navigation.\\nshared-header.css / navigation.js: coordinated navigation for other pages.\\nredesign.css: retained secondary-page overrides.\\nstyle.css / script.js: retained styling and interactions.\\nmenu-viewer.js: menu enlargement.\\nassets/: local images, menu pages, video, and poster.\\n\\nCONFIRM BEFORE LAUNCH\\nConfirm menu prices, restaurant details and any event-specific dates with the restaurant. Google Maps, Facebook, and optional Google Fonts need internet access.\\n\\nFESTIVE ACCENTS UPDATE\\nRed hand-drawn SVG arrow medallions, gold illustrated icon strip, and faded close-up mariachi guitar backgrounds. The supplied hero animation and real restaurant photos remain. fiesta-details.css contains these accents.\\n\\nDECORATIVE IMAGE\\nassets/mariachi-guitar-closeup.webp was created with the built-in image-generation tool as decoration; it is not a photo of the restaurant performers. Prompt: Atmospheric extreme close-up of two mariachi musicians playing acoustic guitars, wooden guitar bodies and strumming hands, black charro jackets with fine gold embroidery, red neckties, no faces, warm amber lighting and dark green/burgundy shadows, wide composition with shadow for text, no lettering or logos.\\n"}')
