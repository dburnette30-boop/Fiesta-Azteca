as{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}\\n.fajita-opening__skip{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));padding:12px 19px;border:1px solid #fff8d780;border-radius:30px;background:#180c07a6;color:#fff8e7;font:14px Arial,sans-serif;cursor:pointer;z-index:2}\\n.fajita-opening__skip:focus-visible{outline:3px solid #fff;outline-offset:4px}\\n.hero-beer.margarita-reveal{animation:margarita-reveal 1.6s ease-out both}\\n@keyframes grill-approach{to{transform:scale(1.1)}}\\n@keyframes margarita-reveal{from{opacity:.15;filter:blur(7px);transform:scale(.97)}to{opacity:1;filter:blur(0);transform:scale(1)}}\\n@media(max-width:600px){.fajita-opening__grill{object-position:50% 58%}}\\n@media(prefers-reduced-motion:reduce){.fajita-opening{display:none}.hero-beer.margarita-reveal{animation:none}}\\n\\n/* Cover the viewport from the first paint, including the scrollbar area. */\\nhtml.intro-pending,html.intro-pending body{overflow:hidden}\\nhtml.intro-pending .fajita-opening[hidden]{display:block}\\n.fajita-opening{width:100vw;height:100vh;height:100dvh}\\n.fajita-opening__grill{position:absolute;inset:0;max-width:none;min-width:100%;min-height:100%}\\n\\n/* A broad translucent silver halo follows the glass as the fire clears. */\\n.margarita-silver-flash{filter:blur(5px);position:fixed;z-index:1001;pointer-events:none;overflow:visible;opacity:0;animation:silver-glass-flash 3.2s .9s ease-out both}\\n.margarita-silver-flash path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-dashoffset:0}\\n@keyframes silver-glass-flash{0%{opacity:0}6%{opacity:1}78%{opacity:1}100%{opacity:0}}\\n@keyframes silver-glass-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}\\n@media(prefers-reduced-motion:reduce){.margarita-silver-flash{display:none}}\\n", "dist/cinco-gallery.css": "/* Keep celebration photos together in a compact, even grid. */\\n.cinco-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));columns:auto;gap:10px;margin:24px 0}\\n.cinco-photos .photo-button{display:block;min-width:0;width:100%;margin:0;border:2px solid #b88b48;border-radius:8px;overflow:hidden}\\n.cinco-photos .photo-button img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}\\n.cinco-photos .photo-button span{font-size:9px;padding:6px 8px;right:5px;bottom:5px}\\n@media(max-width:760px){.cinco-photos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0}.cinco-photos .photo-button span{font-size:8px;padding:4px 6px}}\\n\\n/* Match the shared navy blue page palette. */\\nbody.cinco-celebration{background:radial-gradient(ellipse at 15% 10%,#38789855,transparent 55%),linear-gradient(115deg,#0b2235,#173f59 55%,#0b2235);background-attachment:fixed}\\n", "dist/agave-header.css": "/* Header palette and ornament drawn from the blue agave logo. */\\nheader,.review-rest header,.review-header header,.menu-document>header{position:relative!important;display:flex;align-items:center;justify-content:space-between;min-height:120px;height:auto!important;padding:14px 5%!important;gap:18px;border:0!important;border-image:none!important;border-bottom:2px solid #c49b51!important;background:radial-gradient(ellipse at 15% 10%,#38789855,transparent 55%),linear-gradient(115deg,#0b2235,#173f59 55%,#0b2235)!important;color:#f1ce83!important;box-shadow:inset 0 1px #edcf8d66,inset 0 -6px #0b2235}\\nheader .brand-logo,.review-header header .brand-logo,.menu-document>header .brand-logo{width:270px!important;height:auto!important;max-width:100%;filter:drop-shadow(0 3px 6px #020b13aa)}\\nheader .brand{flex-shrink:0!important}header .brand>span{display:none!important}\\nheader nav{display:flex;position:static;gap:10px;align-items:center;background:transparent!important;padding:0;overflow:visible;max-height:none}\\nheader nav a,header nav .nav-visit,header .header-menu-link,header .menu-toggle{display:inline-flex;align-items:center;jus